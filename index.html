<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mohtarf | Network Security Design | تصميم أمان الشبكات</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:20px;color:#12324f;min-height:100vh;background:linear-gradient(135deg,#1b2a8f,#6a2fc0,#e0409a,#ff8a3d,#1fb6c9);background-size:500% 500%;animation:bg 18s ease infinite;overflow-x:hidden}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bgfx span{position:absolute;bottom:-80px;opacity:.55;animation:up linear infinite;filter:drop-shadow(0 0 8px #fff8)}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
#bgfx i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6,#fff0 70%);animation:pulse ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.6) translate(30px,-20px);opacity:.3}}
header,nav,main{position:relative;z-index:1}
header{text-align:center;padding:14px;color:#fff}
header img{height:120px;background:#fff;border-radius:50%;padding:8px;box-shadow:0 0 0 5px #ffd54f,0 8px 24px #0006;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
h1{margin:8px;font-size:32px;text-shadow:0 3px 10px #0009}
header div{font-size:18px;opacity:.95}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);background:#0003}
nav button{font-size:18px;padding:10px 16px;border:0;border-radius:30px;background:#fff;color:#4a1fa8;cursor:pointer;font-weight:bold;box-shadow:0 4px 0 #0004;transition:.2s}
nav button:hover{transform:translateY(-3px) scale(1.06)}nav button.on{background:linear-gradient(#ffd54f,#ff9800);color:#4a1a00}
main{max-width:1000px;margin:auto;padding:10px}
.card{background:#fffffff0;border-radius:26px;padding:20px;margin:16px 0;box-shadow:0 10px 30px #0005;border-top:8px solid #ff9800;animation:pop .5s}
@keyframes pop{from{transform:scale(.92) translateY(20px);opacity:0}}
.card h2{margin-top:0;color:#6a1fb3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.ar{direction:rtl;text-align:right;background:linear-gradient(135deg,#fff3c4,#ffe0f0);border-radius:18px;padding:16px;line-height:2;font-size:27px;border:3px dashed #ff9800}
.en{direction:ltr;text-align:left;background:linear-gradient(135deg,#d6f1ff,#e4dcff);border-radius:18px;padding:16px;line-height:1.8;font-size:26px;border:3px dashed #3f8cff}
.q{font-size:25px;font-weight:bold;margin:8px 0;color:#7a1d8f}.qe{font-size:21px;margin-bottom:10px;color:#0b4a8b}
button.o{display:block;width:100%;margin:10px 0;padding:14px;font-size:20px;border-radius:18px;border:3px solid #b9a6ff;background:linear-gradient(#fff,#f3eeff);cursor:pointer;transition:.2s;box-shadow:0 4px 0 #b9a6ff}
button.o:hover{transform:translateY(-3px) scale(1.01);border-color:#ff9800;box-shadow:0 7px 0 #ffb74d}
button.good{background:linear-gradient(#d6ffd3,#9af0a0)!important;border-color:#1fa84f;animation:jump .5s}button.bad{background:linear-gradient(#ffe0e0,#ffb3b3)!important;border-color:#e53935;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}@keyframes jump{40%{transform:scale(1.05)}}
.nx,.btn{font-size:21px;padding:12px 26px;border:0;border-radius:30px;background:linear-gradient(#34d27b,#119c55);color:#fff;cursor:pointer;margin-top:10px;font-weight:bold;text-decoration:none;display:inline-block;box-shadow:0 5px 0 #0b6b3a;transition:.2s}
.nx:hover,.btn:hover{transform:translateY(-3px) scale(1.05)}
.pr{display:inline-block;background:#6a1fb3;color:#fff;border-radius:20px;padding:2px 14px;font-size:16px}
.big{font-size:60px;text-align:center}
input{font-size:22px;padding:12px;width:100%;border-radius:16px;border:3px solid #6a1fb3}
.fall{position:fixed;top:-40px;font-size:34px;animation:f 2s linear forwards;pointer-events:none;z-index:99}@keyframes f{to{top:105vh;transform:rotate(360deg)}}
.ans{display:none;margin-top:10px}.sec h2{color:#d81b60}

{t:["🧱 جدار الحماية","🧱 Firewall"],
x:["تخيّل شبكة المؤسسة كمدرسة 🏫 وجدار الحماية هو الحارس عند البوابة: يفحص كل من يدخل أو يخرج، ويسمح أو يمنع حسب قواعد موضوعة مسبقًا. مثال: السماح بالوصول إلى خادم الويب ومنع الوصول الخارجي المباشر إلى قاعدة البيانات. ويوجد عند حدود الشبكة أو بين أجزائها أو على جهاز مضيف.","Imagine the network is a school 🏫 and the firewall is the guard at the gate: it checks everyone entering or leaving and allows or denies by rules set in advance. e.g., allow access to the web server but deny direct external access to the database server. It can sit at the network border, between network parts, or on a host device."],
q:[TF("جدار الحماية يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفقًا لقواعد أمنية محددة.","A firewall monitors network traffic and allows or denies it by set security rules.",1),
TF("يمكن أن يوجد جدار الحماية عند حدود الشبكة أو بين أجزائها أو على جهاز مضيف.","A firewall can be at the network border, between its parts, or on a host.",1),
["ما وظيفة جدار الحماية؟","What is the function of a firewall?",[["مراقبة حركة الشبكة","Monitoring network traffic"],["تخزين الملفات","Storing files"],["إنشاء كلمات المرور","Creating passwords"],["تشغيل التطبيقات","Running applications"]],0],
["أين يمكن أن يوجد جدار الحماية؟","Where can a firewall be located?",[["داخل الطابعة فقط","Inside the printer only"],["عند حدود الشبكة","At the network border"],["في لوحة المفاتيح","In the keyboard"],["داخل الشاشة","Inside the screen"]],1],
["ماذا يفعل جدار الحماية وفقًا لقواعد الأمان؟","What does a firewall do according to security rules?",[["ينسخ البيانات","Copies data"],["يسمح بالاتصال أو يمنعه","Allows or blocks communication"],["يحذف الملفات","Deletes files"],["يضغط البيانات","Compresses data"]],1]]},
{t:["🚇 VPN","🚇 VPN"],
x:["الـVPN نفق خاص ومشفّر داخل طريق عام (الإنترنت) 🚇. الاستخدامات: ① العمل عن بعد من المنزل ② ربط فروع المؤسسة (القاهرة ← VPN ← الإسكندرية). ولأن المحتوى مشفّر تقل مخاطر التنصت حتى على شبكة Wi-Fi العامة في مقهى أو مطار.","A VPN is a private, encrypted tunnel inside a public road (the Internet) 🚇. Uses: ① remote work from home ② connecting branch offices (Cairo ← VPN ← Alexandria). Since the content is encrypted, the risk of eavesdropping is reduced even on public Wi-Fi at a café or airport."],
q:[TF("تستخدم الشبكة الافتراضية الخاصة VPN التشفير وتقنيات النفق لحماية البيانات.","A VPN uses encryption and tunnelling to protect data.",1),
TF("تُستخدم VPN فقط لربط أجهزة المؤسسة داخل المبنى نفسه.","A VPN is used only to connect organization devices inside the same building.",0),
TF("تساعد VPN على حماية البيانات عند استخدام شبكات Wi-Fi العامة.","A VPN helps protect data when using public Wi-Fi.",1),
["اختر الاستخدام الذي لا يمثل استخدامًا مناسبًا للشبكة الافتراضية الخاصة.","Choose the one that is NOT an appropriate use of a VPN.",[["الاتصال بأمان من المنزل بشبكة المؤسسة","Connecting safely from home to the organization's network"],["ربط المكاتب في مواقع مختلفة بأمان","Connecting offices in different locations safely"],["الحذف التلقائي للملفات المصابة بالفيروسات","Automatically deleting files infected with viruses"],["تشفير محتوى الاتصال على شبكة Wi-Fi العامة","Encrypting communication content on public Wi-Fi"]],2],
["ما التقنية التي تستخدمها VPN عادة لحماية البيانات؟","Which technique does a VPN usually use to protect data?",[["الطباعة","Printing"],["التشفير","Encryption"],["الحذف","Deletion"],["النسخ","Copying"]],1]]},
{t:["🏝️ DMZ","🏝️ DMZ"],
x:["المنطقة المعزولة DMZ هي منطقة منفصلة نضع فيها الخوادم المواجهة للجمهور (خادم الويب، خادم البريد) بعيدًا عن الشبكة الداخلية. الترتيب: الإنترنت ← DMZ ← الشبكة الداخلية. فلو تعرّض خادم عام للهجوم، تبقى الشبكة الداخلية محمية ✅.","The DMZ is a separate zone where we place public-facing servers (web, mail) apart from the internal network. Order: Internet ← DMZ ← Internal network. If a public server is attacked, the internal network stays protected ✅."],
q:[TF("المنطقة المعزولة نظام يعرّض جميع الخوادم للخارج.","A DMZ is a system that exposes all servers to the outside.",0),
TF("يساعد وضع الخوادم العامة في DMZ على تقليل احتمال وصول الهجوم إلى الشبكة الداخلية.","Placing public servers in a DMZ helps reduce the chance of an attack reaching the internal network.",1),

x:["الدفاع في العمق = طبقات متعددة من الحماية مثل طبقات البصلة 🧅: إن فشلت طبقة تحمي التي بعدها. الطبقة 1 مدخل الشبكة (جدار حماية) • 2 مسار الاتصال (VPN) • 3 وضع الخوادم (DMZ) • 4 الأجهزة الطرفية (مكافح فيروسات وتحديث النظام).","Defense in depth = many layers of protection, like an onion 🧅: if one layer fails, the next protects. Layer 1 Network entry (firewall) • 2 Communication path (VPN) • 3 Server placement (DMZ) • 4 Endpoints (antivirus and OS updates)."],

{t:["🔐 انعدام الثقة","🔐 Zero Trust"],
x:["انعدام الثقة Zero Trust = «لا تثق تلقائيًا بأحد، حتى من داخل الشبكة»، بل تحقق دائمًا: من أنت؟ هل معك إذن؟ هل جهازك آمن؟ من أين وفي أي سياق تطلب؟ قديمًا كان المحيط الأمني يفترض أن الداخل آمن والخارج خطر، لكن الخدمات السحابية والعمل عن بعد جعلا الحدود غير واضحة.","Zero Trust = “never trust automatically, even inside the network”; always verify: who are you? do you have permission? is your device safe? where/in what context are you asking? The old perimeter assumed inside = safe, outside = dangerous, but cloud services and remote work blurred the boundary."],

const T4=[FW,VP,DZ,DD],TN=["ما المصطلح الذي يصف نظامًا يسمح بالاتصال أو يمنعه وفق قواعد؟","ما الاختصار الذي يصف اتصالًا منطقيًا خاصًا يحمي البيانات عبر شبكة عامة؟","ما الاختصار المكوّن من ثلاثة أحرف للمنطقة التي تُوضع فيها الخوادم المعرضة للخارج بشكل منفصل؟","ما المصطلح لمفهوم تكديس عدة إجراءات أمنية؟"],TE=["Which term is a system that allows or denies communication based on rules?","Which abbreviation is an encrypted private line over the Internet?","Which three-letter abbreviation is the area where exposed servers are kept separate from the internal network?","Which term is the concept of layering multiple security measures?"];
const EX=[];
T4.forEach((t,i)=>EX.push([TN[i],TE[i],T4.map(x=>x),i]));

[["المحيط الأمني وحده أصبح كافيًا مع انتشار الخدمات السحابية والعمل عن بعد.","Perimeter protection alone has become sufficient with cloud services and remote work.",0],["إذا فشلت إحدى طبقات الدفاع في العمق فلا توجد طبقات أخرى يمكنها تقليل الخطر.","If one defense layer fails, no other layers can reduce the risk.",0],["يمكن استخدام VPN لتمكين الموظفين من الاتصال الآمن بشبكة المؤسسة من المنزل.","A VPN can let employees connect securely to the organization's network from home.",1],["الهدف من نهج انعدام الثقة هو منح الثقة لجميع المستخدمين داخل المؤسسة دون تحقق.","The aim of zero trust is to give trust to all users inside the organization without verification.",0],["حماية الأجهزة الطرفية تشمل تثبيت برامج مكافحة الفيروسات وتحديث نظام التشغيل.","Endpoint protection includes antivirus software and keeping the OS updated.",1],["أدت الخدمات السحابية والعمل عن بعد إلى جعل الحدود بين الداخل والخارج أكثر وضوحًا.","Cloud and remote work made the inside/outside boundary clearer.",0]].forEach(a=>EX.push(TF(a[0],a[1],a[2])));

["ما الفائدة الأساسية من فصل الخوادم العامة في DMZ؟","What is the main benefit of separating public servers in a DMZ?","زيادة استهلاك الإنترنت|تقليل احتمال وصول الهجوم إلى الشبكة الداخلية|إلغاء التشفير|تعطيل الخوادم","Increasing Internet use|Reducing the chance of an attack reaching the internal network|Cancelling encryption|Disabling servers",1],
["أي ترتيب يمثل التصميم المبسط للمنطقة المعزولة DMZ؟","Which order represents the simple DMZ design?","الشبكة الداخلية ← الإنترنت ← DMZ|الإنترنت ← DMZ ← الشبكة الداخلية|DMZ ← الإنترنت ← الشبكة الداخلية|الشبكة الداخلية ← DMZ ← الإنترنت","Internal network ← Internet ← DMZ|Internet ← DMZ ← Internal network|DMZ ← Internet ← Internal network|Internal network ← DMZ ← Internet",1],

[["الدفاع في العمق يهدف إلى تقليل احتمال الاختراق والحد من أثره إذا فشلت إحدى الطبقات.","Defense in depth aims to reduce the chance of a breach and limit its effect if one layer fails."],["يفترض الأمان التقليدي أن داخل شبكة المؤسسة آمن وخارجها خطر.","Traditional security assumes inside the organization's network is safe and outside is dangerous."],["يعتمد تصميم أمان الشبكات القوي على تكديس عدة طبقات من الإجراءات الأمنية.","Strong network security design relies on layering several security measures."],["المنطقة المعزولة DMZ هي منطقة توضع فيها الخوادم التي تحتاج إلى استقبال اتصالات من الإنترنت.","The DMZ is an area where servers that need to receive connections from the Internet are placed."]].forEach(a=>EX.push(TF(a[0],a[1],1)));

P[0].x=[`<b>[1] جدار الحماية Firewall:</b> نظام أمني قد يكون جهازًا أو برنامجًا، ووظيفته <b>مراقبة حركة مرور الشبكة</b> (أي مراقبة البيانات التي تتحرك داخل الشبكة وخارجها)، ويسمح بها أو يمنعها وفق <b>قواعد أمنية محددة مسبقًا</b>. يقوم مسؤول الشبكة بتحديد القواعد، مثلًا: السماح للطلاب بالوصول إلى الشبكة ومنع الاتصالات القادمة من مصادر غير موثوقة.<br>💡 <b>مثال للتوضيح:</b> تخيّل جدار الحماية مثل <b>حارس على بوابة المدرسة</b> 🏫: يفحص من يحاول الدخول، يسمح للأشخاص المسموح لهم ويمنع غير المصرح لهم. من وضع القواعد التي ينفذها الحارس؟ المسؤول عن أمن المدرسة.<br><br>📍 <b>أين يوجد جدار الحماية؟</b><br>① <b>عند حدود الشبكة</b> (بين شبكة المؤسسة والإنترنت): الإنترنت ← جدار الحماية ← شبكة المدرسة. يراقب الاتصالات القادمة من الإنترنت أو الخارجة إليه.<br>② <b>بين أجزاء الشبكة:</b> شبكة الطلاب ← جدار حماية ← شبكة الإدارة. حتى لو تمكن مهاجم من الوصول إلى شبكة الطلاب لا يستطيع بسهولة الوصول إلى شبكة الإدارة، وهذا مثال واضح على <b>الدفاع في العمق</b>.<br>③ <b>على جهاز مضيف:</b> جهاز الكمبيوتر أو الخادم نفسه يمتلك حماية تراقب الاتصالات التي تصل إليه أو تخرج منه.<br><br>💡 <b>مثال:</b> السماح بالوصول إلى خادم الويب مع منع الوصول الخارجي المباشر إلى قاعدة البيانات.<br>النظام: المستخدم ← الإنترنت ← جدار الحماية ← خادم الويب ← قاعدة البيانات. خادم الويب هو الذي يتعامل مع المستخدمين، أما قاعدة البيانات فتحتوي على معلومات مهمة وحساسة. لذلك نضع القواعد: يُسمح للمستخدمين بالوصول إلى خادم الويب ✔ ويُمنعون من الوصول المباشر من الإنترنت إلى قاعدة البيانات ✖.<br><br>🔖 <b>مصطلح أساسي:</b> جدار الحماية: يسمح بالاتصال أو يمنعه عند نقطة دخول/خروج الشبكة استنادًا إلى قواعد محددة مسبقًا.`,
`<b>[1] The Role of Firewalls:</b> a security system (a device or a program) that <b>monitors network traffic</b> (the data moving into and out of the network) and allows or denies it based on <b>rules set in advance</b>. The network administrator sets the rules, e.g., allow students to reach the network and block connections from untrusted sources.<br>💡 <b>Illustration:</b> imagine a firewall as a <b>guard at the school gate</b> 🏫: it checks anyone trying to enter, lets authorized people in and stops unauthorized ones. Who wrote the guard's rules? The person responsible for school security.<br><br>📍 <b>Where is a firewall?</b><br>① <b>At the network border</b> (between the organization's network and the Internet): Internet ← Firewall ← School network. It watches connections coming from or going to the Internet.<br>② <b>Between parts of the network:</b> Student network ← Firewall ← Admin network. Even if an attacker reaches the student network, they cannot easily reach the admin network — a clear example of <b>defense in depth</b>.<br>③ <b>On a host device:</b> the computer or server itself has protection that monitors the connections reaching or leaving it.<br><br>💡 <b>Example:</b> allow access to the web server but deny direct external access to the database server.<br>System: User ← Internet ← Firewall ← Web server ← Database. The web server deals with users, while the database holds important, sensitive information. So the rules allow users to reach the web server ✔ and block direct access from the Internet to the database ✖.<br><br>🔖 <b>Key term:</b> firewall — allows or denies communication at a network's entry/exit point based on preset rules.`];
P[1].x=[`<b>[2] الشبكة الافتراضية الخاصة VPN:</b> اتصال أو شبكة منطقية خاصة عبر شبكة عامة مثل الإنترنت، تستخدم عادة <b>التشفير وتقنيات النفق</b> لحماية البيانات بين الطرفين. وهي وسيلة مهمة جدًا ضمن الدفاع في العمق.<br>💡 تخيّل أنك تريد الانتقال من منزلك إلى المدرسة، والطريق الذي ستسلكه هو الإنترنت، وهو طريق عام يستخدمه ملايين الأشخاص. VPN تنشئ لك <b>نفقًا آمنًا ومشفرًا</b> داخل هذا الطريق العام: جهازك ← نفق VPN مشفر ← شبكة المؤسسة 🚇.<br><br>🔒 <b>ماذا يعني التشفير وتقنيات النفق؟</b><br><b>التشفير:</b> يحوّل البيانات إلى شكل غير مفهوم أثناء انتقالها، بحيث يصعب على شخص يتنصت عليها فهمها.<br><b>النفق:</b> إنشاء مسار منطقي خاص لنقل البيانات بين طرفي الاتصال عبر شبكة عامة.<br>إذن VPN = نفق خاص ومغلق داخل طريق عام (الطريق العام = الإنترنت، النفق الآمن = VPN).<br><br>📌 <b>الاستخدامات الرئيسية:</b><br>① <b>العمل عن بعد:</b> الاتصال بأمان بشبكة المؤسسة من المنزل أو أثناء التنقل. مثال: موظف يعمل من المنزل ويريد الوصول إلى ملفات أو أنظمة داخل شبكة المؤسسة؛ بدلًا من الاتصال بطريقة غير آمنة يستخدم VPN: منزل الموظف ← VPN ← شبكة المؤسسة، فيصل إلى الموارد المسموح له بها بطريقة أكثر أمانًا.<br>② <b>ربط الفروع:</b> ربط المكاتب في مواقع مختلفة بأمان. مثال: فرع القاهرة ← VPN ← فرع الإسكندرية؛ فيظهر الاتصال وكأن هناك شبكة خاصة تربط الفروع رغم أن البيانات تنتقل عبر الإنترنت العام.<br>③ <b>تقليل خطر التنصت:</b> لأن محتوى الاتصال يُشفّر، تقل مخاطر التنصت حتى عند استخدام شبكة Wi-Fi عامة (مقهى، مطار، فندق، مكان عام) التي قد تكون أكثر عرضة لمحاولات التنصت على البيانات أثناء انتقالها.<br><br>✍️ <b>عزيزي الطالب تذكّر:</b> جدار الحماية يسمح بمرور البيانات أو يمنعها وفقًا لقواعد محددة. VPN تنقل البيانات بأمان عبر شبكة غير موثوقة.`,
`<b>[2] VPN (Virtual Private Network):</b> a technology that creates an encrypted virtual private line (tunnel) over the Internet, allowing a safe connection to a network from a remote location. It uses <b>encryption and tunnelling</b> and is a very important part of defense in depth.<br>💡 Imagine going from home to school on a public road used by millions — the Internet. A VPN builds you a <b>safe, encrypted tunnel</b> inside that public road: your device ← encrypted VPN tunnel ← organization's network 🚇.<br><br>🔒 <b>What are encryption and tunnelling?</b><br><b>Encryption:</b> converts data into an unreadable form while in transit, so an eavesdropper cannot understand it.<br><b>Tunnelling:</b> creating a private logical path to carry data between the two ends over a public network.<br>So a VPN = a private, closed tunnel inside a public road (public road = Internet, safe tunnel = VPN).<br><br>📌 <b>Main uses of VPN:</b><br>① <b>Remote work:</b> connecting safely to the organization's network from home or while away. e.g., an employee working from home needs files on the organization's network; instead of an unsafe connection, they use a VPN: employee's home ← VPN ← organization's network, reaching permitted resources more safely.<br>② <b>Connecting branches:</b> connecting offices in different locations safely. e.g., Cairo branch ← VPN ← Alexandria branch; it looks like a private network joins the branches even though data travels over the public Internet.<br>③ <b>Reducing eavesdropping:</b> because the communication content is encrypted, the risk of eavesdropping is reduced even on public Wi-Fi (café, airport, hotel, public place), which is more exposed to eavesdropping attempts.<br><br>✍️ <b>Remember:</b> a firewall allows or blocks traffic by set rules. A VPN carries data safely across an untrusted network.`];
P[2].x=[`<b>[3] المنطقة المعزولة DMZ (Demilitarized Zone):</b> في شبكات الكمبيوتر هي منطقة <b>منفصلة داخل تصميم الشبكة</b> نضع فيها الخوادم التي تحتاج إلى استقبال اتصالات من الإنترنت والتي يحتاج المستخدمون من خارج المؤسسة إلى الوصول إليها، مثل خوادم الويب وخوادم البريد.<br>يساعد فصل الخوادم العامة في منطقة معزولة على <b>تقليل احتمال وصول الهجوم منها إلى الشبكة الداخلية</b> إذا تعرض أحدها للاختراق.<br>نضع هذه الخوادم في منطقة منفصلة لأن خادم الويب مثلًا يجب أن يكون متاحًا للمستخدمين عبر الإنترنت، لكننا لا نريد أن يكون الإنترنت متصلًا مباشرة بالشبكة الداخلية للمؤسسة. لذلك نقسم الشبكة إلى مناطق: <b>الإنترنت ← DMZ ← الشبكة الداخلية</b> 🏝️.<br><br>🖼️ <b>تكوين شبكة المنطقة المعزولة:</b><br>الشبكة الخارجية (الإنترنت: المستخدمون والمهاجم) ← جدار حماية ← DMZ (خادم الويب وخادم البريد: خوادم معرضة للإنترنت منفصلة عن الشبكة الداخلية) ← جدار حماية ← الشبكة الداخلية (خادم قاعدة البيانات، الكمبيوتر الشخصي، البيانات السرية).<br>✅ إذا تمت مهاجمة خادم عام فإن الشبكة الداخلية لا تزال محمية.<br><br>🤔 <b>توقف وفكر:</b> لماذا يكون وضع خادم ويب عام في المنطقة المعزولة (DMZ) أكثر أمانًا من وضعه داخل الشبكة الداخلية؟ (الإجابة النموذجية في تبويب المقالي)<br><br>🔖 <b>مصطلح أساسي:</b> DMZ: منطقة للخوادم المواجهة للجمهور، منفصلة عن الشبكة الداخلية.`,
`<b>[3] DMZ (Demilitarized Zone):</b> in computer networks, a <b>separate zone within the network design</b> where we place servers that must receive connections from the Internet and that users outside the organization need to reach, such as web servers and mail servers.<br>Separating public servers in an isolated zone <b>reduces the chance that an attack from them reaches the internal network</b> if one of them is breached.<br>We keep these servers apart because a web server, for example, must be available to Internet users, but we do not want the Internet connected directly to the organization's internal network. So we divide the network into zones: <b>Internet ← DMZ ← Internal network</b> 🏝️.<br><br>🖼️ <b>DMZ network configuration:</b><br>External network (Internet: users and attacker) ← Firewall ← DMZ (web server and mail server: servers exposed to the Internet, separated from the internal network) ← Firewall ← Internal network (DB server, PC, confidential data).<br>✅ If a public server is attacked, the internal network is still protected.<br><br>🤔 <b>Pause & Think:</b> Why is it safer to place a public web server in a DMZ rather than inside the internal network? (Model answer in the Essay tab)<br><br>🔖 <b>Key term:</b> DMZ — a zone for public-facing servers, separated from the internal network.`];
P[3].x=[`<b>[4] الدفاع في العمق (Defense in Depth):</b> يعني استخدام <b>ضوابط أمنية متعددة</b> (طبقات مختلفة من الحماية) بدل الاعتماد على وسيلة واحدة، بحيث تساعد طبقات أخرى على تقليل الخطر والحد من أثر الاختراق إذا فشلت إحدى الطبقات 🧅. فلا نكتفي بوسيلة حماية واحدة لأنها إذا فشلت قد تتعرض موارد الشبكة للخطر.<br>في أمان الشبكات يتم الجمع بين عدة إجراءات على النحو التالي:<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:22px" border=1><tr style="background:#ffd54f"><th>طبقة الحماية</th><th>أمثلة على الإجراءات</th></tr><tr><td>الطبقة 1: مدخل الشبكة</td><td>منع الاتصال غير المصرح به باستخدام جدار الحماية</td></tr><tr><td>الطبقة 2: مسار الاتصال</td><td>تشفير الاتصال باستخدام الشبكة الافتراضية الخاصة VPN</td></tr><tr><td>الطبقة 3: وضع الخوادم</td><td>فصل الخوادم المواجهة للجمهور عن الشبكة الداخلية باستخدام DMZ</td></tr><tr><td>الطبقة 4: الأجهزة الطرفية</td><td>تثبيت برنامج مكافحة الفيروسات والحفاظ على تحديث نظام التشغيل</td></tr></table>🔖 <b>مصطلح أساسي:</b> الدفاع في العمق: تكديس الإجراءات الأمنية في طبقات متعددة. إذا فشلت طبقة، تبقى طبقات أخرى تقلل الخطر.`,
`<b>[4] Defense in Depth:</b> the concept of <b>layering multiple security measures</b> instead of relying on one, so that even if one measure is breached, the next can still protect the system 🧅. We do not settle for one protection because, if it fails, network resources may be put at risk.<br>In network security, multiple measures are combined as follows:<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:22px" border=1><tr style="background:#aee0ff"><th>Layer</th><th>Examples of measures</th></tr><tr><td>Layer 1: Network entry</td><td>Block unauthorized communication using a firewall</td></tr><tr><td>Layer 2: Communication path</td><td>Encrypt communication using a VPN</td></tr><tr><td>Layer 3: Server placement</td><td>Separate public-facing servers from the internal network using a DMZ</td></tr><tr><td>Layer 4: Endpoints</td><td>Install antivirus software and keep the OS updated</td></tr></table>🔖 <b>Key term:</b> defense in depth — layering measures. If one layer falls, the next holds.`];
P[4].x=[`<b>[5] مفهوم نهج انعدام الثقة (Zero Trust):</b> نهج أمني <b>لا يمنح الثقة تلقائيًا</b> لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة. تُفحص الهوية والصلاحيات والسياق عند طلب الوصول إلى الموارد وفق سياسة المؤسسة.<br>💡 <b>توضيح:</b> «لا تثق تلقائيًا بأي شخص أو جهاز، حتى لو كان داخل شبكة المؤسسة». وجود المستخدم داخل الشبكة لا يعني أنه آمن تلقائيًا، بل عند محاولته الوصول إلى مورد معين يتم التحقق من:<br>👤 <b>الهوية:</b> من أنت؟ &nbsp; 🔑 <b>الصلاحيات:</b> هل لديك إذن للوصول إلى هذا المورد؟ &nbsp; 💻 <b>الجهاز:</b> هل الجهاز الذي تستخدمه مسموح به وآمن؟ &nbsp; 🔍 <b>السياق:</b> من أين تحاول الوصول؟ ومتى؟ وما طبيعة الطلب؟<br>وبناءً على هذه المعلومات يتم اتخاذ القرار: السماح بالوصول أو رفضه. مثال: حتى عند الوصول من داخل المؤسسة يُتحقق من الهوية والصلاحيات في كل مرة.<br><br>🛡️ <b>المحيط الأمني (Perimeter):</b> الحد الفاصل بين الشبكة الداخلية للمؤسسة (يُفترض أنها آمنة) والعالم الخارجي/الإنترنت (يُفترض أنه غير آمن). صُمم الأمان التقليدي حول حماية المحيط بناءً على فرضية «داخل الشبكة آمن وخارجها خطر»: إذا كنت داخل الشبكة فأنت موثوق به وإذا كنت خارجها فأنت غير موثوق به. لذلك كانت الحماية: الإنترنت ← جدار الحماية ← الشبكة الداخلية.<br>☁️ <b>ثم ظهرت الخدمات السحابية:</b> لم تعد كل أنظمة المؤسسة داخل شبكتها؛ أصبحت الملفات والتطبيقات والبيانات على خوادم سحابية ويمكن الوصول إليها عبر الإنترنت. وكذلك <b>العمل عن بعد:</b> الموظف يعمل من أي مكان: الموظف ← الإنترنت ← خدمة المؤسسة. فهل الموظف «داخل» الشبكة أم «خارجها»؟ هنا أصبحت الحدود غير واضحة.<br>لذلك لم تعد حماية المحيط وحدها كافية، فنحتاج إلى حماية إضافية داخل الشبكة: التحقق من هوية المستخدم وصلاحياته، حماية كل مورد بشكل منفصل، ومراقبة طلبات الوصول. وهذا أدى إلى ظهور نهج انعدام الثقة (الثقة صفر).<br><br>🔖 <b>مصطلحات:</b> الدفاع في العمق: تكديس الإجراءات الأمنية في طبقات. نهج انعدام الثقة: التحقق من كل عملية وصول.`,
`<b>[5] The Concept of Zero Trust:</b> a security approach that <b>does not trust automatically</b> any user or device just because it is inside the network or owned by the organization. Identity, permissions and context are checked when access to resources is requested, according to the organization's policy.<br>💡 <b>Explanation:</b> "Never trust anyone or any device automatically, even inside the organization's network." Being inside the network does not make a user safe automatically; when they try to reach a resource, the system verifies:<br>👤 <b>Identity:</b> who are you? &nbsp; 🔑 <b>Permissions:</b> do you have permission for this resource? &nbsp; 💻 <b>Device:</b> is your device allowed and safe? &nbsp; 🔍 <b>Context:</b> where are you trying to access from, when, and what is the request?<br>Based on this, the decision is made: allow or deny. e.g., even for access from inside the organization, identity verification and permission checks are done every time.<br><br>🛡️ <b>Perimeter:</b> the boundary between the organization's internal network (assumed safe) and the outside world/Internet (assumed unsafe). Conventional network security was designed around protecting the perimeter, based on the premise "inside is safe, outside is dangerous": inside = trusted, outside = untrusted. So protection looked like: Internet ← Firewall ← Internal network.<br>☁️ <b>Then cloud services appeared:</b> not all of the organization's systems are inside its network any more; files, apps and data sit on cloud servers reachable over the Internet. And <b>remote work:</b> an employee can work from anywhere: Employee ← Internet ← Organization's service. Is the employee "inside" or "outside"? The boundary became unclear.<br>So protecting only the perimeter is no longer enough; we need extra protection inside the network: verify user identity and permissions, protect each resource separately, and monitor access requests. This led to <b>zero trust</b>.<br><br>🔖 <b>Key terms:</b> defense in depth — layering measures. zero trust — verify every access.`];

const ES=[["اشرح لماذا يحمي تكديس عدة إجراءات أمنية في طبقات (الدفاع في العمق) المؤسسة بشكل أفضل من الاعتماد على جدار الحماية وحده. [6 درجات] (استعن بـ: ما يحدث إذا تم اختراق أحد الإجراءات)","Explain why layering several security measures (defense in depth) protects an organization better than relying on a firewall alone. [6] (Refer to: what happens if one measure is breached)","إذا اعتمدت المؤسسة على جدار حماية واحد فقط ثم تم اختراقه، يصبح النظام كله مكشوفًا (نقطة فشل واحدة). أما مع الدفاع في العمق فتوجد طبقات متعددة: جدار حماية عند المدخل، VPN لتشفير الاتصال، DMZ لعزل الخوادم العامة، وحماية الأجهزة الطرفية. فإذا فشلت طبقة تساعد الطبقات الأخرى على تقليل الخطر والحد من أثر الاختراق، فيقل احتمال وصول المهاجم إلى البيانات.","If an organization relies on one firewall only and it is breached, the whole system is exposed (a single point of failure). With defense in depth there are several layers: a firewall at the entry, a VPN to encrypt communication, a DMZ to isolate public servers, and endpoint protection. If one layer fails, the others still reduce the risk and limit the damage, so an attacker is far less likely to reach the data."],
["لماذا يكون وضع خادم ويب عام في المنطقة المعزولة (DMZ) أكثر أمانًا من وضعه داخل الشبكة الداخلية؟","Why is it safer to place a public web server in a DMZ rather than inside the internal network?","لأن خادم الويب متاح للجمهور فهو الأكثر عرضة للهجوم. وضعه في DMZ منفصلة عن الشبكة الداخلية يعني أنه إذا تم اختراقه فلن يصل المهاجم مباشرة إلى البيانات السرية وقاعدة البيانات داخل الشبكة الداخلية.","The web server is open to the public, so it is the most exposed to attack. Placing it in a DMZ separate from the internal network means that if it is compromised, the attacker cannot reach the confidential data and database inside the internal network directly."],
["ينقل مستشفى سجلات مرضاه إلى خدمة سحابية ويسمح للأطباء بالوصول إليها من المنزل. باستخدام نهج انعدام الثقة والدفاع في العمق، اقترح إجراءين ينبغي تطبيقهما وبيّن أين يساعد كل منهما، ثم حدّد خطرًا واحدًا قد يظل قائمًا.","A hospital moves patient records to the cloud and lets doctors access them from home. Using zero trust and defense in depth, suggest two measures, say where each helps, and identify one risk that may remain.","① الإجراء الأول: VPN لتشفير اتصال الأطباء من المنزل (طبقة مسار الاتصال، تقلل التنصت). ② الإجراء الثاني: التحقق من الهوية والصلاحيات والجهاز عند كل طلب وصول (انعدام الثقة، يمنع الدخول غير المصرح به). الخطر الذي قد يبقى: اختراق حساب طبيب بسبب تصيد أو كلمة مرور ضعيفة، أو جهاز طبيب غير محدّث.","① Measure 1: a VPN to encrypt doctors' connections from home (communication-path layer; reduces eavesdropping). ② Measure 2: verify identity, permissions and device on every access request (zero trust; blocks unauthorized access). A remaining risk: a doctor's account being compromised by phishing or a weak password, or an out-of-date device."],
["اقترح إجراءً واحدًا يمكن لشركة صغيرة إضافته بجانب جدار الحماية، وتهديدًا واحدًا سيظل غير مزال.","Suggest one measure a small company could add beyond a firewall, and one threat it would still not remove.","إضافة برنامج مكافحة فيروسات على الأجهزة (الأجهزة الطرفية). ويظل التهديد قائمًا مثل التصيد الاحتيالي أو خطأ الموظف عند فتح رابط خبيث.","Adding antivirus software on devices (endpoints). A threat that remains: phishing or an employee's mistake of opening a malicious link."],
["تأمل: ما الطبقة الدفاعية التي تعتقد أنها الأسهل على المهاجم لتجاوزها، ولماذا؟","Reflect: Which layer of defense do you think is easiest for an attacker to get past, and why?","الأجهزة الطرفية غالبًا هي الأسهل، لأن حمايتها تعتمد على المستخدم نفسه: قد يفتح رابطًا خبيثًا (تصيد)، أو يؤجل تحديث النظام، أو يستخدم كلمة مرور ضعيفة، فيتجاوز المهاجم الجدار الناري دون كسره. لذلك نحتاج بقية الطبقات وانعدام الثقة.","The endpoints are often the easiest, because their protection depends on the user: someone may open a malicious link (phishing), delay OS updates or use a weak password, letting the attacker bypass the firewall without breaking it. That is why we need the other layers and zero trust."],
["فكّر كمهندس: ابحث ثم قرر. تقوم شركة في مدينتك بإعداد شبكة مكتبها. لديها موقع إلكتروني عام، وموظفون يعملون من المنزل، وبيانات سرية لعملاء الشركة. أنت تقدم المشورة بشأن تصميم الأمان. (1) اجمع البيانات: اذكر الأصول الثلاثة والتهديد الرئيسي لكل منها. (2) رتّب الطبقات الأربع من الأكثر إلى الأقل أهمية لهذه الشركة وبرّر اختيارك الأول. (3) اتخذ قرارًا: أوصِ بتصميم وقدّم سببين يوضحان لماذا التكديس أكثر أمانًا من جدار حماية واحد.","Think as an Engineer: Investigate & Decide. A company in your city is setting up its office network. It has a public website, staff who work from home, and confidential customer data. You advise on the security design. (1) Collect data: list the three assets and the main threat to each. (2) Rank the four defense-in-depth layers from most to least critical and justify your top choice. (3) Decide: recommend a design and give two reasons why layering is safer than a single firewall.","(1) الأصول والتهديدات: الموقع العام ← هجوم على الخادم المكشوف للإنترنت؛ الموظفون عن بعد ← التنصت على الاتصال أو سرقة بيانات الدخول على شبكات Wi-Fi العامة؛ قاعدة بيانات العملاء ← وصول غير مصرح به وسرقة البيانات. (2) الترتيب: ① وضع الخوادم (DMZ) لأن الموقع هو الأصل الأكثر عرضة، وعزله يمنع وصول الهجوم إلى قاعدة البيانات ② مسار الاتصال (VPN) لحماية الموظفين عن بعد ③ مدخل الشبكة (جدار الحماية) ④ الأجهزة الطرفية. (3) القرار: تصميم متعدد الطبقات (جدار حماية + VPN + DMZ + أجهزة طرفية) مع انعدام الثقة. السبب الأول: إذا فشلت طبقة تحمي الأخرى فلا توجد نقطة فشل واحدة. السبب الثاني: لكل أصل طبقة مناسبة لتهديده، والتحقق من كل وصول يمنع استغلال أي ثغرة.","(1) Assets and threats: public website ← attack on the server exposed to the Internet; remote staff ← eavesdropping or stolen login details on public Wi-Fi; customer database ← unauthorized access and data theft. (2) Ranking: ① Server placement (DMZ) because the website is the most exposed asset and isolating it stops an attack from reaching the database ② Communication path (VPN) to protect remote staff ③ Network entry (firewall) ④ Endpoints. (3) Decision: a layered design (firewall + VPN + DMZ + endpoints) with zero trust. Reason 1: if one layer fails the others still protect, so there is no single point of failure. Reason 2: each asset gets a layer suited to its threat, and verifying every access prevents any gap from being exploited."],
["السؤال الرئيسي: كيف يمكن لمؤسسة أن تصمم شبكتها بحيث، حتى لو تم اختراق أحد الدفاعات، يظل النظام محميًا؟","Lesson Question: How can an organization design its network so that, even if one defense is breached, the system stays protected?","الإجابة هي التكديس (الطبقات): يراقب جدار الحماية حركة الشبكة، وتحمي VPN الاتصال عن بعد بالتشفير، وتفصل المنطقة المعزولة DMZ الخوادم العامة عن الشبكة الداخلية، وتحمي ضوابط الأجهزة الطرفية كل جهاز. ومع السحابة والعمل عن بعد أصبح الاعتماد على موقع المستخدم داخل الشبكة أقل فاعلية، لذلك لا يمنح نهج انعدام الثقة ثقة تلقائية بل يطلب التحقق من الهوية والصلاحيات عند كل وصول. تعمل هذه الطبقات معًا لتقليل الخطر والحد من أثر الاختراق.","The answer is layering: a firewall controls what enters and leaves the network; a VPN encrypts communication from remote locations; a DMZ separates public-facing servers so an attack on them cannot reach internal data; and endpoint measures protect each device. Because cloud services and remote work have blurred the line between inside and outside, zero trust adds a further principle: no access is trusted automatically and every request is verified. Together they keep the network protected even when a single measure fails."],
["الفائز – السؤال الثالث: أكمل العبارات من بين القوسين (العمل عن بُعد – DMZ – التشفير – طبقات – جدار الحماية):<br>1- المنطقة التي توضع فيها الخوادم المواجهة للإنترنت تسمى ......<br>2- يُقصد بالدفاع في العمق استخدام عدة ...... من الحماية بدلًا من الاعتماد على وسيلة واحدة.<br>3- النظام الذي يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفقًا لقواعد أمنية هو ......<br>4- تستخدم الشبكة الافتراضية الخاصة ...... وتقنيات النفق لحماية البيانات.<br>5- من أهم استخدامات VPN تمكين الموظفين من ...... بشبكة المؤسسة بأمان.","Fayez – Q3: Complete from the words (Remote work – DMZ – Encryption – Layers – Firewall):<br>1- The area where Internet-facing servers are placed is called ......<br>2- Defense in depth means using several ...... of protection instead of one measure.<br>3- The system that monitors network traffic and allows or blocks it by security rules is the ......<br>4- A VPN uses ...... and tunnelling to protect data.<br>5- A key use of a VPN is letting employees do ...... connecting securely to the organization's network.","1- DMZ 2- طبقات 3- جدار الحماية 4- التشفير 5- العمل عن بُعد","1- DMZ 2- Layers 3- Firewall 4- Encryption 5- Remote work"],
["الفائز – السؤال الرابع: اذكر المصطلح العلمي لكل مما يلي:<br>1- نظام أمني يراقب حركة مرور الشبكة ويسمح بالاتصال أو يمنعه وفقًا لقواعد.<br>2- اتصال أو شبكة منطقية خاصة عبر شبكة عامة، تستخدم التشفير والنفق.<br>3- منطقة منفصلة توضع فيها الخوادم التي تستقبل اتصالات من الإنترنت.<br>4- استخدام عدة طبقات من الضوابط بدلًا من وسيلة حماية واحدة.<br>5- نهج أمني لا يمنح الثقة تلقائيًا لأي مستخدم أو جهاز ويعتمد على التحقق من كل عملية وصول.<br>6- الحد الفاصل للمؤسسة عن الشبكات الخارجية مثل الإنترنت.<br>7- تحويل البيانات إلى شكل غير مفهوم لمنع الآخرين من قراءتها أثناء انتقالها.<br>8- التأكد من أن الشخص الذي يحاول الدخول هو الشخص المصرح له فعلًا.<br>9- الخوادم التي تحتاج إلى استقبال اتصالات من الإنترنت مثل خادم الويب وخادم البريد.<br>10- أجهزة وأنظمة تتصل بالشبكة وتحتاج إلى الحماية مثل الكمبيوتر والخوادم.","Fayez – Q4: Give the scientific term for each:<br>1- A security system that monitors network traffic and allows or blocks it by rules.<br>2- A private logical connection/network over a public network using encryption and tunnelling.<br>3- A separate zone where servers receiving Internet connections are placed.<br>4- Using several layers of controls instead of one protection measure.<br>5- A security approach that gives no automatic trust to any user or device and verifies every access.<br>6- The boundary separating the organization's internal network from external networks like the Internet.<br>7- Converting data into an unreadable form so others cannot read it in transit.<br>8- Making sure the person trying to log in is really the authorized person.<br>9- Servers that need to receive Internet connections, like web and mail servers.<br>10- Devices and systems connected to the network that need protection, like computers and servers.","1- جدار الحماية 2- VPN 3- DMZ 4- الدفاع في العمق 5- انعدام الثقة (Zero Trust) 6- المحيط الأمني 7- التشفير 8- المصادقة 9- الخوادم العامة (المواجهة للجمهور) 10- موارد الشبكة (الأجهزة والخوادم المطلوب حمايتها)","1- Firewall 2- VPN 3- DMZ 4- Defense in depth 5- Zero trust 6- Perimeter 7- Encryption 8- Authentication 9- Public-facing servers 10- Network resources (the devices and servers to protect)"],
["الفائز – السؤال الخامس: أكمل مكان النقط:<br>1- في نهج الثقة يتم التحقق من الهوية و...... وسياق طلب الوصول.<br>2- كان الأمان التقليدي يعتمد على حماية ...... الأمني للشبكة.<br>3- أدى انتشار ...... الخدمات والعمل عن بُعد إلى عدم وضوح الحدود بين داخل الشبكة وخارجها.<br>4- الهدف من الدفاع في العمق هو تقليل احتمال الاختراق والحد من ...... الاختراق.<br>5- التصميم الذي يجمع جدار الحماية وVPN وDMZ وحماية الأجهزة الطرفية ونهج انعدام الثقة يوفر ...... أقوى للشبكة.<br>6- تُستخدم VPN أيضًا في ...... مكاتب المؤسسة الموجودة في مواقع مختلفة بأمان.<br>7- من أمثلة الخوادم التي يمكن وضعها في DMZ خادم ...... وخادم البريد.<br>8- يساعد وضع الخوادم العامة في DMZ على تقليل احتمال وصول الهجوم إلى الشبكة ......<br>9- يشمل حماية الأجهزة الطرفية تثبيت برنامج ...... الفيروسات.<br>10- نهج ...... الثقة لا يمنح الثقة تلقائيًا لأي مستخدم أو جهاز.","Fayez – Q5: Fill in the blanks:<br>1- In zero trust, identity, ...... and the context of the request are verified.<br>2- Traditional security relied on protecting the network ......<br>3- The spread of ...... services and remote work blurred the line between inside and outside.<br>4- Defense in depth aims to reduce the chance of a breach and limit the ...... of the breach.<br>5- The design combining firewall, VPN, DMZ, endpoint protection and zero trust gives ...... that is stronger.<br>6- A VPN is also used for ...... the organization's offices in different locations securely.<br>7- Examples of servers in a DMZ: the ...... server and the mail server.<br>8- Public servers in a DMZ reduce the chance of an attack reaching the ...... network.<br>9- Endpoint protection includes installing ...... software (against viruses).<br>10- The ...... trust approach gives no automatic trust to any user or device.","1- الصلاحيات 2- المحيط 3- السحابية 4- أثر 5- حماية 6- ربط 7- الويب 8- الداخلية 9- مكافحة 10- انعدام","1- permissions 2- perimeter 3- cloud 4- impact 5- protection 6- connecting 7- web 8- internal 9- antivirus 10- zero (انعدام)"],
["تمارين كتاب الطالب – الأسئلة 3 و4 و5 و8 و9 و10:<br>3) ما المصطلح / الاختصار (VPN) / الاختصار الثلاثي (DMZ) / مفهوم تكديس الإجراءات؟<br>4) اختر ما لا يمثل استخدامًا مناسبًا للـVPN.<br>5) لكل إجراء (1–4) بيّن الطبقة (أ–د).<br>8) أكمل الفقرة (أ–د).<br>9) السبب الأنسب لاستخدام DMZ.<br>10) الخيار الأنسب لمفهوم انعدام الثقة.","Student Book Exercises – Q3, 4, 5, 8, 9, 10:<br>3) Which term / abbreviation (VPN) / three-letter abbreviation (DMZ) / term for layering measures?<br>4) Choose what is NOT an appropriate use of a VPN.<br>5) For each measure (1–4) give its layer (A–D).<br>8) Fill in the passage blanks (a–d).<br>9) The most appropriate reason for a DMZ.<br>10) The option that best describes zero trust.","3) جدار الحماية – VPN – DMZ – الدفاع في العمق. 4) [ج] الحذف التلقائي للملفات المصابة بالفيروسات. 5) 1-أ مدخل الشبكة، 2-ب مسار الاتصال، 3-د الأجهزة الطرفية، 4-ج وضع الخوادم. 8) (أ) جدار الحماية (ب) DMZ (ج) VPN (د) الدفاع في العمق. 9) [ج] لمنع الضرر عن الشبكة الداخلية حتى لو تعرض خادم مواجه للجمهور للهجوم. 10) [ج] لا تُمنح الثقة تلقائيًا ويُتحقق من كل طلب.","3) Firewall – VPN – DMZ – Defense in depth. 4) [C] Automatically deleting files infected with viruses. 5) 1-A Network entry, 2-B Communication path, 3-D Endpoints, 4-C Server placement. 8) (a) Firewall (b) DMZ (c) VPN (d) Defense in depth. 9) [C] To prevent damage to the internal network even if a public-facing server is attacked. 10) [C] No access is trusted automatically and every request is verified."]];

function run(el,qs,done){let i=0,s=0,lock=0;(function show(){if(i>=qs.length)return done(s,qs.length);lock=0;const q=qs[i];el.innerHTML=`<div class=pr>${i+1} / ${qs.length}</div><div class=q dir=rtl>${q[0]}</div><div class=qe>${q[1]}</div>`+q[2].map((o,k)=>`<button class=o data-k=${k}><span dir=rtl style="display:block;text-align:right">${"أبجد"[k]}) ${o[0]}</span><span style="display:block">${"ABCD"[k]}) ${o[1]}</span></button>`).join("")+`<div id=fb class=big></div>`;

function tab(n){document.querySelectorAll("nav button").forEach((b,k)=>b.classList.toggle("on",k-1==n));if(n<0){m.innerHTML=`<div class="card sec"><h2>🚀 مقدمة الدرس | Lesson Introduction</h2><div class=two><div class=ar>🏢 شبكة أي شركة أو مدرسة فيها بيانات مهمة: سجلات العملاء، الملفات المالية، والرسائل الخاصة. والمهاجمون يبحثون دائمًا عن طريق للدخول! 🕵️<br>قفل واحد على الباب لا يكفي: لو تم كسره ينكشف كل ما بالداخل. لذلك تستخدم الشبكات الحديثة <b>عدة طبقات</b> من الحماية، فإذا اخترقوا طبقة تحمي التي بعدها.<br><br>❓ <b>السؤال الرئيسي:</b> كيف يمكن لمؤسسة أن تصمم شبكتها بحيث، حتى لو تم اختراق أحد الدفاعات، يظل النظام محميًا؟</div><div class=en>🏢 Every company or school network holds important data: customer records, financial files and private messages. Attackers are always looking for a way in! 🕵️<br>A single lock on the front door is not enough: if it is picked, everything inside is exposed. So modern networks use <b>several layers</b> of protection: if one is breached, the next still protects the system.<br><br>❓ <b>Guiding question:</b> How can an organization design its network so that, even if one defense is breached, the system stays protected?</div></div></div>
<div class=card><h2>🎯 أهداف التعلم | Learning Objectives</h2><div class=two><div class=ar>✅ اشرح أدوار جدار الحماية وVPN وDMZ وضوابط الأجهزة الطرفية في حماية الشبكة.<br>✅ اشرح لماذا يوفر الدفاع في العمق حماية أقوى من إجراء أمني واحد.<br>✅ فهم نهج انعدام الثقة (التحقق من كل عملية وصول).</div><div class=en>✅ Explain the roles of firewalls, VPNs and DMZs in protecting a network.<br>✅ Describe defense in depth and zero trust, and why layered, verified access is stronger than a single barrier.</div></div></div>
<div class=card><h2>📚 قبل أن نبدأ | Before We Start</h2><div class=two><div class=ar>في الدرس السابق تعلّمت وسائل لحماية الاتصال والحسابات، مثل:<br>🔒 <b>التشفير:</b> يحوّل البيانات إلى شكل غير مفهوم لمنع الآخرين من قراءتها أثناء انتقالها.<br>✅ <b>المصادقة:</b> التأكد من أن الشخص الذي يحاول الدخول هو الشخص المصرح له فعلًا. مثال: عندما تدخل إلى حسابك بكلمة مرور ورمز يصل إلى هاتفك فأنت تستخدم المصادقة.<br><br>في هذا الدرس لا نتوقف عند حماية الحسابات والبيانات فقط، بل ننتقل إلى <b>حماية الشبكة نفسها</b>. لماذا؟ لأن شبكات المؤسسات تحتفظ ببيانات وخدمات مهمة قد يحاول مهاجم الوصول إليها.<br><b>حماية الشبكة</b> تعني حماية أجهزة الكمبيوتر، الخوادم، أجهزة الشبكة، البيانات التي تنتقل عبر الشبكة، والخدمات والأنظمة داخل المؤسسة. ولا نكتفي بوسيلة حماية واحدة؛ فإذا فشلت قد تتعرض موارد الشبكة للخطر، لذلك نستخدم <b>الدفاع في العمق</b>: عدة طبقات مختلفة من الحماية، مما يقلل احتمال الاختراق ويحد من أثره.<br><br>🗝️ <b>المفاهيم الأساسية:</b> جدار الحماية • VPN • DMZ • الدفاع في العمق • نهج انعدام الثقة • المحيط الأمني<br>⭐ <b>الفكرة الأساسية:</b> يأتي أمان الشبكات القوي من تكديس الإجراءات (جدار الحماية ← VPN ← DMZ ← حماية الأجهزة الطرفية) ومن التحقق من كل عملية وصول (نهج انعدام الثقة) وليس من حاجز واحد.</div><div class=en>In the previous lesson you learned ways to protect communication and accounts, such as:<br>🔒 <b>Encryption:</b> converts data into an unreadable form so others cannot read it in transit.<br>✅ <b>Authentication:</b> making sure the person trying to log in is really the authorized person. e.g., when you log in with a password and a code sent to your phone, you use authentication.<br><br>In this lesson we do not stop at protecting accounts and data; we move to <b>protecting the network itself</b>. Why? Because organizations' networks hold important data and services that an attacker may try to reach.<br><b>Network protection</b> means protecting computers, servers, network devices, the data moving across the network, and the services and systems inside the organization. One protection measure is not enough; if it fails, network resources may be at risk, so we use <b>defense in depth</b>: several different layers of protection, which lowers the chance of a breach and limits its effect.<br><br>🗝️ <b>Key concepts:</b> firewall • VPN • DMZ • defense in depth • zero trust • perimeter<br>⭐ <b>Key Fact:</b> strong network security comes from layering measures (firewall ← VPN ← DMZ ← endpoint protection) and from verifying every access (zero trust), not from a single barrier.</div></div></div>
<div class=card><h2>🗺️ خريطة الدرس | Lesson Map</h2><div class=two><div class=ar>🧱 جدار الحماية ⇦ 🚇 VPN ⇦ 🏝️ DMZ ⇦ 🧅 الدفاع في العمق ⇦ 🔐 انعدام الثقة</div><div class=en>🧱 Firewall ⇨ 🚇 VPN ⇨ 🏝️ DMZ ⇨ 🧅 Defense in depth ⇨ 🔐 Zero trust</div></div><div style="text-align:center"><button class=nx onclick="tab(0)">ابدأ الدرس ▶ Start the lesson</button></div></div>`}else if(n<5){const p=P[n];m.innerHTML=`<div class="card sec"><h2>${p.t[0]} | ${p.t[1]}</h2><div class=two><div class=ar>${p.x[0]}</div><div class=en>${p.x[1]}</div></div></div><div class=card><h2>🎯 تدريب | Practice</h2><div id=qz><button class=nx id=st>ابدأ التدريب ▶ Start</button></div></div>`;$("#st").onclick=()=>run($("#qz"),p.q,(s,t)=>$("#qz").innerHTML=`<div class=big>${s>=t*.8?"🏆":"💪"}</div><h2 style="text-align:center">${s} / ${t}</h2><div style="text-align:center"><button class=nx onclick="tab(${n})">إعادة | Retry</button></div>`)}
else if(n==5)exam();else if(n==7){m.innerHTML=`<div class=card><h2>📌 ملخص الدرس | Lesson Summary</h2><div class=two><div class=ar>⭐ <b>الخلاصة:</b> كدّس دفاعاتك — جدار الحماية، الشبكة الافتراضية الخاصة، المنطقة المعزولة والأجهزة الطرفية — وتحقق من كل عملية وصول (نهج انعدام الثقة). عندها يصبح من غير المرجح أن يؤدي خرق واحد إلى كشف الشبكة بأكملها.<br>① <b>حماية الشبكة:</b> تهدف إلى حماية الأجهزة والخوادم والبيانات والخدمات والأنظمة، ولا يكفي الاعتماد على وسيلة أمنية واحدة.<br>② <b>الدفاع في العمق:</b> استخدام عدة طبقات أمنية لتقليل احتمال الاختراق والحد من أضراره: جدار الحماية + VPN + DMZ + حماية الأجهزة الطرفية + نهج انعدام الثقة.<br>③ <b>جدار الحماية:</b> يراقب حركة الشبكة ويسمح بالاتصالات أو يمنعها وفق قواعد أمنية محددة.<br>④ <b>VPN:</b> يوفر اتصالًا آمنًا ومشفرًا عبر الإنترنت، ويُستخدم في العمل عن بعد وربط الفروع وتقليل مخاطر التنصت.<br>⑤ <b>DMZ:</b> منطقة منفصلة توضع فيها الخوادم التي تستقبل اتصالات من الإنترنت مثل خادم الويب والبريد، لحماية الشبكة الداخلية إذا تم اختراق أحدها. الإنترنت ← DMZ ← الشبكة الداخلية.<br>⑥ <b>نهج انعدام الثقة:</b> لا تثق تلقائيًا بل تحقق دائمًا من الهوية والصلاحيات وسياق الوصول قبل السماح باستخدام الموارد. قصور الأمان التقليدي: داخل الشبكة = آمن، وخارجها = خطر؛ لكن مع الخدمات السحابية والعمل عن بعد أصبحت الحدود غير واضحة فلم تعد حماية محيط الشبكة وحدها كافية.<br>🎯 <b>الخلاصة:</b> أمان الشبكات القوي = طبقات متعددة من الحماية + التحقق المستمر من الوصول. فإذا فشلت إحدى الطبقات تساعد الطبقات الأخرى على منع الاختراق أو تقليل أضراره.<br><br>🌟 <b>تذكّر:</b> كدّس دفاعاتك وتحقق من كل عملية وصول؛ فيقل احتمال أن يكشف خرق واحد الشبكة كلها.</div><div class=en>⭐ <b>Summary:</b> Layer your defenses — firewall, VPN, DMZ, endpoints — and verify every access (zero trust). One breach is then far less likely to expose the whole network.<br>① <b>Network protection:</b> aims to protect devices, servers, data, services and systems; relying on one security measure is not enough.<br>② <b>Defense in depth:</b> using several security layers to lower the chance of a breach and limit its damage: firewall + VPN + DMZ + endpoint protection + zero trust.<br>③ <b>Firewall:</b> monitors network traffic and allows or blocks connections by set security rules.<br>④ <b>VPN:</b> provides a safe, encrypted connection over the Internet; used for remote work, connecting branches and reducing eavesdropping risk.<br>⑤ <b>DMZ:</b> a separate zone for servers that receive Internet connections, such as web and mail servers, protecting the internal network if one is breached. Internet ← DMZ ← Internal network.<br>⑥ <b>Zero trust:</b> never trust automatically; always verify identity, permissions and access context before allowing resource use. Traditional security assumed inside = safe, outside = dangerous; but with cloud services and remote work the boundary is blurred, so perimeter protection alone is no longer enough.<br>🎯 <b>Bottom line:</b> strong network security = multiple layers of protection + continuous verification of access. If one layer fails, the others help prevent a breach or reduce its damage.</div></div></div>
<div class=card><h2>✎ مثال محلول | Worked Example</h2><div class=two><div class=ar>① ضع ✓ أو ✗: [أ] جدار الحماية يسمح بالاتصال أو يمنعه وفق قواعد محددة مسبقًا ✓ [ب] يقلل VPN مخاطر التنصت حتى على Wi-Fi العامة ✓ [ج] DMZ نظام يعرّض جميع الخوادم للخارج ✗ (هي منطقة توضع فيها الخوادم المواجهة للجمهور منفصلة عن الشبكة الداخلية) [د] الدفاع في العمق مفهوم تكديس عدة إجراءات أمنية في طبقات ✓<br>② طابق: (1) تقنية تنشئ خطًا افتراضيًا مشفرًا للاتصال الآمن من موقع بعيد = [ب] VPN • (2) منطقة تُوضع فيها الخوادم المعرَّضة للخارج منفصلة عن الشبكة الداخلية = [ج] DMZ • (3) نظام يسمح بالاتصال أو يمنعه وفق قواعد محددة = [أ] جدار الحماية.</div><div class=en>① Mark ○ true / × false: A Firewall allows or denies communication by preset rules ○ B A VPN reduces eavesdropping risk even on public Wi-Fi ○ C A DMZ exposes all servers to the outside × (it is an area where public-facing servers are placed separately from the internal network) D Defense in depth layers multiple security measures ○<br>② Match: a. a technology creating an encrypted virtual private line for safe remote connection = B VPN • b. an area where exposed servers are placed separately from the internal network = C DMZ • c. a system allowing or denying communication by preset rules = A Firewall.</div></div></div>`}else{m.innerHTML=`<div class=card><h2>✍️ الأسئلة المقالية والإجابات النموذجية | Essay Questions & Model Answers</h2></div>`+ES.map((e,i)=>`<div class=card><div class=ar>${i+1}. ${e[0]}</div><div class=en>${i+1}. ${e[1]}</div><button class=nx onclick="this.nextElementSibling.style.display='block'">الإجابة النموذجية | Model answer</button><div class=ans><div class=ar>✅ ${e[2]}</div><br><div class=en>✅ ${e[3]}</div></div></div>`).join("")}}
